<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 단어 퀴즈</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff9db;
      color: #292929;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .app {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #f0e4ad;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(90, 75, 20, 0.09);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #686868;
      font-size: 14px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      margin-bottom: 28px;
      background: #eeeeee;
      border-radius: 99px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: #eab308;
      border-radius: 99px;
      transition: width 0.2s ease;
    }

    .question-label {
      margin-bottom: 8px;
      color: #777777;
      font-size: 13px;
      text-align: center;
    }

    .word {
      margin: 0 0 28px;
      font-size: 36px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .instruction {
      margin-bottom: 12px;
      font-size: 14px;
      color: #555555;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice {
      min-height: 60px;
      padding: 12px;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      background: #ffffff;
      color: #292929;
      font-size: 16px;
      cursor: pointer;
      overflow-wrap: anywhere;
      transition: background 0.15s, border-color 0.15s;
    }

    .choice:not(:disabled):hover {
      border-color: #eab308;
      background: #fffbea;
    }

    .choice:focus-visible,
    .main-button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    .choice:disabled {
      cursor: default;
      opacity: 1;
    }

    .choice.correct {
      border-color: #16a34a;
      background: #dcfce7;
      color: #166534;
    }

    .choice.wrong {
      border-color: #dc2626;
      background: #fee2e2;
      color: #991b1b;
    }

    .feedback {
      min-height: 52px;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #f5f5f5;
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .feedback:empty {
      visibility: hidden;
    }

    .feedback.success {
      background: #dcfce7;
      color: #166534;
    }

    .feedback.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .save-status {
      min-height: 40px;
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #666666;
      overflow-wrap: anywhere;
    }

    .main-button {
      width: 100%;
      min-height: 50px;
      margin-top: 12px;
      padding: 13px 18px;
      border: none;
      border-radius: 12px;
      background: #eab308;
      color: #292929;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-button:hover {
      background: #facc15;
    }

    .main-button:disabled {
      background: #e5e5e5;
      color: #777777;
      cursor: default;
    }

    .result {
      text-align: center;
    }

    .result h2 {
      margin: 0 0 14px;
      font-size: 25px;
    }

    .score {
      margin: 20px 0;
      font-size: 48px;
      font-weight: bold;
      color: #a16207;
    }

    .result-message {
      color: #555555;
      line-height: 1.7;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 380px) {
      .app {
        padding: 20px 16px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .word {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>영어 단어 퀴즈</h1>
    <p class="subtitle">영어 단어의 뜻을 선택하세요.</p>

    <section id="quiz-screen">
      <div class="progress-row">
        <span id="progress-text">문제 1 / 3</span>
        <span id="current-score">현재 점수: 0점</span>
      </div>

      <div
        class="progress-track"
        role="progressbar"
        aria-label="퀴즈 진행률"
        aria-valuemin="0"
        aria-valuemax="3"
        aria-valuenow="1"
        id="progress-bar"
      >
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="question-label" id="question-label">QUESTION 1</div>
      <h2 class="word" id="word">abundant</h2>

      <p class="instruction">알맞은 한국어 뜻을 선택하세요.</p>

      <div class="choices" id="choices">
        <button type="button" class="choice" data-option="조용한">조용한</button>
        <button type="button" class="choice" data-option="풍부한">풍부한</button>
        <button type="button" class="choice" data-option="위험한">위험한</button>
        <button type="button" class="choice" data-option="느린">느린</button>
      </div>

      <div
        class="feedback"
        id="feedback"
        role="status"
        aria-live="polite"
      ></div>

      <div
        class="save-status"
        id="save-status"
        role="status"
        aria-live="polite"
      >응답 저장 상태가 여기에 표시됩니다.</div>

      <button type="button" class="main-button hidden" id="next-button">
        다음 문제
      </button>
    </section>

    <section id="result-screen" class="result hidden">
      <h2>퀴즈 완료!</h2>
      <p>최종 점수</p>
      <div class="score" id="final-score">0 / 3</div>
      <p class="result-message" id="result-message"></p>
      <div
        class="save-status"
        id="final-save-status"
        role="status"
        aria-live="polite"
      ></div>
      <button type="button" class="main-button" id="retry-button">
        다시 풀기
      </button>
    </section>
  </main>

  <script>
    // 1. Supabase 설정: 본인의 프로젝트 값으로 교체하세요.
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_PUBLISHABLE_KEY = "YOUR_PUBLISHABLE_KEY";

    // 2. 문제 데이터
    const QUESTIONS = [
      {
        question_no: 1,
        english_word: "abundant",
        options: ["조용한", "풍부한", "위험한", "느린"],
        answer: "풍부한"
      },
      {
        question_no: 2,
        english_word: "reluctant",
        options: ["주저하는", "열정적인", "정확한", "부지런한"],
        answer: "주저하는"
      },
      {
        question_no: 3,
        english_word: "brief",
        options: ["강력한", "평범한", "짧은", "불규칙한"],
        answer: "짧은"
      }
    ];

    // 설정값을 입력한 경우에만 Supabase 클라이언트를 만듭니다.
    const isConfigured =
      SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
      SUPABASE_PUBLISHABLE_KEY !== "YOUR_PUBLISHABLE_KEY" &&
      SUPABASE_URL.startsWith("https://") &&
      SUPABASE_PUBLISHABLE_KEY.length > 0;

    const supabaseClient = isConfigured
      ? window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        )
      : null;

    // 3. 퀴즈 상태
    let attemptId = "";
    let questionIndex = 0;
    let score = 0;
    let questionStartedAt = 0;
    let answered = false;
    let completed = false;

    // 각 문제의 저장 상태를 응시 단위로 관리합니다.
    let saveStates = [];

    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const progressText = document.getElementById("progress-text");
    const currentScore = document.getElementById("current-score");
    const progressBar = document.getElementById("progress-bar");
    const progressFill = document.getElementById("progress-fill");
    const questionLabel = document.getElementById("question-label");
    const wordElement = document.getElementById("word");
    const choicesElement = document.getElementById("choices");
    const feedbackElement = document.getElementById("feedback");
    const saveStatusElement = document.getElementById("save-status");
    const nextButton = document.getElementById("next-button");
    const finalScoreElement = document.getElementById("final-score");
    const resultMessageElement = document.getElementById("result-message");
    const finalSaveStatusElement =
      document.getElementById("final-save-status");

    // 4. 새 퀴즈 시작: 응시 ID를 새로 생성합니다.
    function startQuiz() {
      attemptId = crypto.randomUUID();
      questionIndex = 0;
      score = 0;
      answered = false;
      completed = false;

      saveStates = QUESTIONS.map(() => ({
        attempted: false,
        status: "pending"
      }));

      quizScreen.classList.remove("hidden");
      resultScreen.classList.add("hidden");

      renderQuestion();
    }

    // 5. 현재 문제를 렌더링합니다.
    function renderQuestion() {
      const question = QUESTIONS[questionIndex];

      answered = false;

      progressText.textContent =
        `문제 ${questionIndex + 1} / ${QUESTIONS.length}`;

      currentScore.textContent = `현재 점수: ${score}점`;

      progressBar.setAttribute("aria-valuenow", questionIndex + 1);
      progressFill.style.width =
        `${(questionIndex / QUESTIONS.length) * 100}%`;

      questionLabel.textContent =
        `QUESTION ${question.question_no}`;

      wordElement.textContent = question.english_word;

      feedbackElement.textContent = "";
      feedbackElement.className = "feedback";

      saveStatusElement.textContent = isConfigured
        ? "응답을 선택하면 저장합니다."
        : "Supabase 설정 전입니다. 응답은 데이터베이스에 저장되지 않습니다.";

      nextButton.classList.add("hidden");
      nextButton.textContent =
        questionIndex === QUESTIONS.length - 1
          ? "결과 보기"
          : "다음 문제";

      // 기존 버튼을 재사용하며, 정해진 순서와 위치를 유지합니다.
      const buttons = Array.from(
        choicesElement.querySelectorAll(".choice")
      );

      question.options.forEach((option, index) => {
        const button = buttons[index];

        button.textContent = option;
        button.dataset.option = option;
        button.disabled = false;
        button.classList.remove("correct", "wrong");
      });

      // 화면에 문제가 표시된 직후부터 시간을 측정합니다.
      questionStartedAt = performance.now();
    }

    // 6. 첫 번째 선택만 채점하고 저장합니다.
    async function selectAnswer(button) {
      if (answered || completed) return;

      // 비동기 저장을 시작하기 전에 잠급니다.
      answered = true;

      const question = QUESTIONS[questionIndex];
      const chosenAnswer = button.dataset.option;
      const responseTimeMs = Math.max(
        0,
        Math.round(performance.now() - questionStartedAt)
      );

      const isCorrect = chosenAnswer === question.answer;

      if (isCorrect) {
        score += 1;
        feedbackElement.textContent = "정답입니다!";
        feedbackElement.className = "feedback success";
      } else {
        feedbackElement.textContent =
          `오답입니다. 정답은 '${question.answer}'입니다.`;
        feedbackElement.className = "feedback error";
      }

      currentScore.textContent = `현재 점수: ${score}점`;

      // 모든 선택지를 비활성화하여 답 변경을 막습니다.
      const buttons = choicesElement.querySelectorAll(".choice");

      buttons.forEach((choiceButton) => {
        choiceButton.disabled = true;

        if (choiceButton.dataset.option === question.answer) {
          choiceButton.classList.add("correct");
        }

        if (choiceButton === button && !isCorrect) {
          choiceButton.classList.add("wrong");
        }
      });

      nextButton.classList.remove("hidden");

      // 문제별로 INSERT를 한 번만 시도합니다.
      await saveAnswer({
        question,
        chosenAnswer,
        isCorrect,
        responseTimeMs
      });
    }

    // 7. 지정된 컬럼만 INSERT합니다.
    async function saveAnswer({
      question,
      chosenAnswer,
      isCorrect,
      responseTimeMs
    }) {
      const state = saveStates[questionIndex];

      if (state.attempted) return;

      state.attempted = true;

      if (!supabaseClient) {
        state.status = "not_configured";
        saveStatusElement.textContent =
          "저장 안 됨: Supabase URL과 Publishable Key를 설정하세요.";
        updateFinalSaveStatus();
        return;
      }

      state.status = "saving";
      saveStatusElement.textContent = "응답 저장 중...";

      const row = {
        attempt_id: attemptId,
        question_no: question.question_no,
        english_word: question.english_word,
        chosen_answer: chosenAnswer,
        is_correct: isCorrect,
        response_time_ms: responseTimeMs
      };

      try {
        // SELECT, UPDATE, DELETE, insert().select()는 사용하지 않습니다.
        const { error } = await supabaseClient
          .from("quiz_answers")
          .insert([row]);

        if (error) {
          throw error;
        }

        state.status = "saved";
        saveStatusElement.textContent = "저장 성공";
      } catch (error) {
        state.status = "failed";
        saveStatusElement.textContent =
          "저장 실패. 퀴즈는 계속 진행할 수 있습니다.";
        console.error("응답 저장 실패:", error);
      }

      updateFinalSaveStatus();
    }

    // 8. 다음 문제 또는 결과 화면으로 이동합니다.
    function goNext() {
      if (!answered || completed) return;

      if (questionIndex < QUESTIONS.length - 1) {
        questionIndex += 1;
        renderQuestion();
      } else {
        showResult();
      }
    }

    // 9. 최종 결과를 표시합니다.
    function showResult() {
      completed = true;

      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      finalScoreElement.textContent = `${score} / ${QUESTIONS.length}`;

      if (score === 3) {
        resultMessageElement.textContent = "모든 문제를 맞혔어요!";
      } else if (score === 0) {
        resultMessageElement.textContent =
          "괜찮아요. 단어 뜻을 복습하고 다시 도전해 보세요.";
      } else {
        resultMessageElement.textContent =
          "잘했어요! 틀린 단어의 뜻을 다시 확인해 보세요.";
      }

      updateFinalSaveStatus();
    }

    // 10. 저장 상태를 요약합니다.
    function updateFinalSaveStatus() {
      if (!completed) return;

      const saved = saveStates.filter(
        (state) => state.status === "saved"
      ).length;

      const failed = saveStates.filter(
        (state) => state.status === "failed"
      ).length;

      const notConfigured = saveStates.filter(
        (state) => state.status === "not_configured"
      ).length;

      const pending = saveStates.filter(
        (state) =>
          state.status === "pending" || state.status === "saving"
      ).length;

      if (!isConfigured || notConfigured > 0) {
        finalSaveStatusElement.textContent =
          "Supabase 설정이 없어 응답이 저장되지 않았습니다.";
      } else if (pending > 0) {
        finalSaveStatusElement.textContent =
          `저장 결과 확인 중 · 성공 ${saved} / ${QUESTIONS.length}`;
      } else if (failed > 0) {
        finalSaveStatusElement.textContent =
          `저장 성공 ${saved}개, 실패 ${failed}개. 실패한 응답은 자동 재전송하지 않습니다.`;
      } else {
        finalSaveStatusElement.textContent =
          `응답 ${saved}개 저장 성공`;
      }
    }

    // 버튼 이벤트는 한 번만 등록합니다.
    choicesElement.addEventListener("click", (event) => {
      const button = event.target.closest(".choice");

      if (!button || !choicesElement.contains(button)) return;

      selectAnswer(button);
    });

    nextButton.addEventListener("click", goNext);
    document.getElementById("retry-button").addEventListener(
      "click",
      startQuiz
    );

    // 첫 화면을 시작합니다.
    startQuiz();
  </script>
</body>
</html>
